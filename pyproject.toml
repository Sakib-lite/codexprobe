[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-probe"
version = "0.1.0"
description = "Recording reverse proxy between the Codex CLI and any OpenAI-compatible LLM backend"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "mypy==2.4.0",
    "ruff==0.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
files = ["src", "tests", "examples"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["E501"]
